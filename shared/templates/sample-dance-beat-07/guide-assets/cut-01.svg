    <line x1="34" y1="264" x2="34" y2="252" />
    <line x1="48" y1="268" x2="48" y2="246" />
    <line x1="62" y1="274" x2="62" y2="236" stroke="#f5c680" />
    <line x1="76" y1="266" x2="76" y2="248" />
    <line x1="90" y1="276" x2="90" y2="234" stroke="#f5c680" />
    <line x1="104" y1="265" x2="104" y2="250" />
    <line x1="118" y1="274" x2="118" y2="236" stroke="#f5c680" />
    <line x1="132" y1="267" x2="132" y2="248" />
    <line x1="146" y1="264" x2="146" y2="252" />
  </g>
  <text x="90" y="294" text-anchor="middle" font-size="8" font-family="monospace" fill="#f5c680">STEADY VIDEO + BEAT GLOW</text>
