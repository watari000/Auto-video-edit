<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 320" role="img" aria-label="ダンス動画の音声ビートに合わせて画面がわずかに振動する演出ガイド">
  <rect width="180" height="320" rx="8" fill="#111114" />
