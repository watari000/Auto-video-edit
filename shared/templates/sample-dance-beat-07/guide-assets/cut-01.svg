<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 320" role="img" aria-label="ダンス動画の音声ビートに合わせて縁がバックライトのように微かに光る演出ガイド">
  <defs>
    <linearGradient id="glowRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5c680" stop-opacity="0.38" />
      <stop offset="20%" stop-color="#f5c680" stop-opacity="0" />
      <stop offset="80%" stop-color="#f5c680" stop-opacity="0" />
      <stop offset="100%" stop-color="#f5c680" stop-opacity="0.38" />
    </linearGradient>
  </defs>
  <rect width="180" height="320" rx="8" fill="#111114" />
  <rect x="4" y="4" width="172" height="312" rx="6" fill="url(#glowRim)" stroke="#f5c680" stroke-opacity="0.65" stroke-width="2" />
  <g stroke="#f4f1ea" stroke-opacity="0.55" stroke-width="1.5" fill="none">
    <path d="M16 28 V16 H28" /><path d="M152 16 H164 V28" /><path d="M16 292 V304 H28" /><path d="M152 304 H164 V292" />
  </g>
  <circle cx="24" cy="24" r="2.5" fill="#f5c680" />
  <text x="32" y="27" font-size="7.5" font-family="monospace" letter-spacing="1" fill="#f4f1ea" fill-opacity="0.8">EDGE BACKLIGHT GLOW</text>
  <!-- Steady dancer silhouette -->
  <circle cx="90" cy="84" r="14" fill="#d4af7a" fill-opacity="0.22" stroke="#d4af7a" stroke-width="1.4" />
  <path d="M90 100 V168 M54 126 L90 112 L126 124 M90 168 L66 226 M90 168 L114 224" stroke="#f4f1ea" stroke-width="2" stroke-linecap="round" fill="none" />
  <!-- Audio beat waveform -->
