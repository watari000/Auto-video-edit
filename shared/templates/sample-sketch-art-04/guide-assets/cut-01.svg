<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 320" role="img" aria-label="カット1：インク線画から斜めに実写へ切り替わる構図ガイド">
  <defs>
    <clipPath id="diag1">
      <polygon points="0,0 180,0 0,210" />
    </clipPath>
  </defs>
  <rect width="180" height="320" rx="8" fill="#111114" />
  <!-- Top-left reality hint -->
  <rect width="180" height="320" rx="8" fill="#231c18" clip-path="url(#diag1)" />
  <rect x="6" y="6" width="168" height="308" rx="4" fill="none" stroke="#f4f1ea" stroke-opacity="0.16" stroke-width="1" />
  <!-- Hand-drawn outer border -->
  <rect x="14" y="14" width="152" height="292" rx="4" fill="none" stroke="#f4f1ea" stroke-opacity="0.65" stroke-width="1.3" stroke-dasharray="6 3" />
  <circle cx="24" cy="24" r="2.5" fill="#ff4d1c" />
  <text x="32" y="27" font-size="7.5" font-family="monospace" letter-spacing="1" fill="#f4f1ea" fill-opacity="0.75">SKETCH 01 // 2.2S</text>
  <!-- Subject wireframe / sketch -->
  <rect x="44" y="78" width="92" height="134" rx="4" fill="none" stroke="#f4f1ea" stroke-width="1.4" />
  <path d="M44 120 H136 M68 120 V212 M112 120 V212" stroke="#f4f1ea" stroke-opacity="0.55" stroke-width="1.1" />
  <circle cx="90" cy="99" r="11" fill="#d4af7a" fill-opacity="0.25" stroke="#d4af7a" stroke-width="1.2" />
  <!-- Diagonal reveal line -->
  <line x1="180" y1="0" x2="0" y2="210" stroke="#ff4d1c" stroke-width="2" />
  <text x="90" y="236" text-anchor="middle" font-size="8.5" font-family="monospace" fill="#d4af7a">SKETCH -> REALITY</text>
  <rect x="26" y="250" width="128" height="26" rx="13" fill="#16161b" stroke="#d4af7a" stroke-opacity="0.55" stroke-width="1" stroke-dasharray="3 3" />
  <text x="90" y="266" text-anchor="middle" font-size="9" font-family="sans-serif" fill="#f4f1ea" fill-opacity="0.88">テロップ安全枠</text>
</svg>
