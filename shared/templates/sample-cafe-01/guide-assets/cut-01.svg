<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 320" role="img" aria-label="カット1：お店の外観や看板を中央に収める縦構図ガイド">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8efe6" />
      <stop offset="100%" stop-color="#eadbc8" />
    </linearGradient>
  </defs>
  <rect width="180" height="320" rx="16" fill="url(#bg1)" />
  <!-- Rule of thirds guides -->
  <g stroke="#b89f87" stroke-width="0.8" stroke-dasharray="4 4" opacity="0.7">
    <line x1="60" y1="12" x2="60" y2="308" />
    <line x1="120" y1="12" x2="120" y2="308" />
    <line x1="12" y1="106" x2="168" y2="106" />
    <line x1="12" y1="214" x2="168" y2="214" />
  </g>
  <!-- Cafe facade silhouette -->
  <rect x="34" y="64" width="112" height="162" rx="8" fill="#8b6b52" opacity="0.22" stroke="#6f523b" stroke-width="2" />
  <rect x="52" y="80" width="76" height="28" rx="6" fill="#6f523b" opacity="0.85" />
  <text x="90" y="98" text-anchor="middle" font-size="11" font-family="sans-serif" font-weight="bold" fill="#fff7ed">CAFE SIGN</text>
  <rect x="64" y="124" width="52" height="102" rx="4" fill="#6f523b" opacity="0.45" />
  <circle cx="107" cy="176" r="3" fill="#fff7ed" />
  <!-- Zoom-in cue arrows -->
  <g stroke="#d97706" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M26 40 L40 54 M34 54 L40 54 L40 48" />
    <path d="M154 40 L140 54 M146 54 L140 54 L140 48" />
  </g>
  <!-- Safe text zone -->
  <rect x="28" y="248" width="124" height="30" rx="15" fill="#1f2937" opacity="0.78" />
  <text x="90" y="267" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#ffffff">テロップ表示位置</text>
</svg>
