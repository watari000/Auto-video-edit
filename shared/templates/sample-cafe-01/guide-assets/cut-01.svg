<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 320" role="img" aria-label="カット1：お店の外観や看板を中央に収める縦構図ガイド">
  <rect width="180" height="320" rx="8" fill="#111114" />
  <rect x="6" y="6" width="168" height="308" rx="4" fill="none" stroke="#f4f1ea" stroke-opacity="0.14" stroke-width="1" />

  <!-- Corner viewfinder brackets -->
  <g stroke="#f4f1ea" stroke-opacity="0.55" stroke-width="1.5" fill="none">
    <path d="M16 28 V16 H28" />
    <path d="M152 16 H164 V28" />
    <path d="M16 292 V304 H28" />
    <path d="M152 304 H164 V292" />
  </g>

  <!-- Rule of thirds grid -->
  <g stroke="#f4f1ea" stroke-opacity="0.12" stroke-width="0.8" stroke-dasharray="3 4">
    <line x1="60" y1="16" x2="60" y2="304" />
    <line x1="120" y1="16" x2="120" y2="304" />
    <line x1="16" y1="106" x2="164" y2="106" />
    <line x1="16" y1="214" x2="164" y2="214" />
  </g>

  <!-- HUD top meta -->
  <circle cx="24" cy="24" r="2.5" fill="#ff4d1c" />
  <text x="32" y="27" font-size="7.5" font-family="monospace" letter-spacing="1" fill="#f4f1ea" fill-opacity="0.7">SHOT 01 // 1.5S</text>

  <!-- Cafe facade architectural linework -->
  <rect x="34" y="66" width="112" height="158" rx="3" fill="#f4f1ea" fill-opacity="0.04" stroke="#f4f1ea" stroke-opacity="0.65" stroke-width="1.3" />
  <rect x="50" y="80" width="80" height="26" rx="2" fill="#d4af7a" fill-opacity="0.16" stroke="#d4af7a" stroke-width="1.2" />
  <text x="90" y="96" text-anchor="middle" font-size="9" font-family="monospace" letter-spacing="1.4" fill="#f4f1ea">CAFE SIGN</text>
  <rect x="64" y="122" width="52" height="102" rx="2" fill="none" stroke="#f4f1ea" stroke-opacity="0.4" stroke-width="1.2" />
  <line x1="90" y1="122" x2="90" y2="224" stroke="#f4f1ea" stroke-opacity="0.22" stroke-width="1" />
  <circle cx="107" cy="174" r="2.5" fill="#d4af7a" />

  <!-- Zoom-in motion vectors -->
  <g stroke="#ff4d1c" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 44 L38 58 M31 58 H38 V51" />
    <path d="M156 44 L142 58 M149 58 H142 V51" />
  </g>

  <!-- Safe text zone -->
  <rect x="26" y="246" width="128" height="28" rx="14" fill="#16161b" stroke="#d4af7a" stroke-opacity="0.55" stroke-width="1" stroke-dasharray="3 3" />
  <text x="90" y="263" text-anchor="middle" font-size="9.5" font-family="sans-serif" fill="#f4f1ea" fill-opacity="0.88">テロップ安全枠</text>
</svg>
