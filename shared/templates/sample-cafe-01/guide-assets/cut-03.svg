<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 320" role="img" aria-label="カット3：テーブル全体を広く写してゆっくり引く構図ガイド">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3ece4" />
      <stop offset="100%" stop-color="#dfcdb9" />
    </linearGradient>
  </defs>
  <rect width="180" height="320" rx="16" fill="url(#bg3)" />
  <!-- Rule of thirds guides -->
  <g stroke="#b89f87" stroke-width="0.8" stroke-dasharray="4 4" opacity="0.7">
    <line x1="60" y1="12" x2="60" y2="308" />
    <line x1="120" y1="12" x2="120" y2="308" />
    <line x1="12" y1="106" x2="168" y2="106" />
    <line x1="12" y1="214" x2="168" y2="214" />
  </g>
  <!-- Table items in lower two-thirds -->
  <rect x="20" y="130" width="140" height="162" rx="14" fill="#a48368" opacity="0.22" stroke="#8b6b52" stroke-width="1.5" />
  <!-- Plate -->
  <circle cx="70" cy="224" r="32" fill="#fffaf3" stroke="#7c5b43" stroke-width="2" opacity="0.85" />
  <circle cx="70" cy="224" r="20" fill="#d9b99b" opacity="0.6" />
  <!-- Cup -->
  <circle cx="126" cy="186" r="18" fill="#6f523b" opacity="0.82" />
  <circle cx="126" cy="186" r="12" fill="#e6cbb3" />
  <!-- Zoom-out cue arrows -->
  <g stroke="#d97706" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M40 54 L26 40 M32 40 L26 40 L26 46" />
    <path d="M140 54 L154 40 M148 40 L154 40 L154 46" />
  </g>
  <!-- Center text zone -->
  <rect x="28" y="144" width="124" height="28" rx="8" fill="#1f2937" opacity="0.72" />
  <text x="90" y="162" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#ffffff">テロップ表示位置</text>
</svg>
