<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 320" role="img" aria-label="カット3：テーブル全体を広く写してゆっくり引く構図ガイド">
  <rect width="180" height="320" rx="8" fill="#111114" />
  <rect x="6" y="6" width="168" height="308" rx="4" fill="none" stroke="#f4f1ea" stroke-opacity="0.14" stroke-width="1" />

  <!-- Corner viewfinder brackets -->
  <g stroke="#f4f1ea" stroke-opacity="0.55" stroke-width="1.5" fill="none">
    <path d="M16 28 V16 H28" />
    <path d="M152 16 H164 V28" />
    <path d="M16 292 V304 H28" />
    <path d="M152 304 H164 V292" />
  </g>

  <!-- Rule of thirds grid -->
  <g stroke="#f4f1ea" stroke-opacity="0.12" stroke-width="0.8" stroke-dasharray="3 4">
    <line x1="60" y1="16" x2="60" y2="304" />
    <line x1="120" y1="16" x2="120" y2="304" />
    <line x1="16" y1="106" x2="164" y2="106" />
    <line x1="16" y1="214" x2="164" y2="214" />
  </g>

  <!-- HUD top meta -->
  <circle cx="24" cy="24" r="2.5" fill="#ff4d1c" />
  <text x="32" y="27" font-size="7.5" font-family="monospace" letter-spacing="1" fill="#f4f1ea" fill-opacity="0.7">SHOT 03 // 1.5S</text>

  <!-- Table boundary in lower two-thirds -->
  <rect x="20" y="132" width="140" height="160" rx="6" fill="#f4f1ea" fill-opacity="0.04" stroke="#f4f1ea" stroke-opacity="0.45" stroke-width="1.2" />

  <!-- Plate -->
  <circle cx="68" cy="232" r="32" fill="#f4f1ea" fill-opacity="0.08" stroke="#f4f1ea" stroke-opacity="0.75" stroke-width="1.4" />
  <circle cx="68" cy="232" r="20" fill="none" stroke="#d4af7a" stroke-opacity="0.65" stroke-width="1" />

  <!-- Overhead cup -->
  <circle cx="126" cy="196" r="18" fill="#f4f1ea" fill-opacity="0.08" stroke="#f4f1ea" stroke-opacity="0.75" stroke-width="1.4" />
  <circle cx="126" cy="196" r="11" fill="#d4af7a" fill-opacity="0.24" stroke="#d4af7a" stroke-width="1" />

  <!-- Zoom-out motion vectors -->
  <g stroke="#ff4d1c" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M38 58 L24 44 M31 44 H24 V51" />
    <path d="M142 58 L156 44 M149 44 H156 V51" />
  </g>

  <!-- Center text zone -->
  <rect x="26" y="144" width="128" height="26" rx="4" fill="#16161b" stroke="#d4af7a" stroke-opacity="0.55" stroke-width="1" stroke-dasharray="3 3" />
  <text x="90" y="160" text-anchor="middle" font-size="9.5" font-family="sans-serif" fill="#f4f1ea" fill-opacity="0.88">テロップ安全枠</text>
</svg>
